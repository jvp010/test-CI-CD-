name: .NET CI

on:
  push:
  pull_request:

permissions:
  contents: write   # Required so the workflow can push tags

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      # Optional tests
      # - name: Run tests
      #   run: dotnet test MobyParkAPI.Tests/MobyParkAPI.Tests.csproj --no-build --configuration Release --logger trx

      - name: Generate new Git tag
        id: tag
        run: |
          current_commit=$(git rev-parse HEAD)
          echo "Current commit: $current_commit"

          # Check if this commit already has a tag
          existing_tag=$(git tag --points-at $current_commit)

          if [ -n "$existing_tag" ]; then
              echo "Commit $current_commit already has tag(s): $existing_tag"
              echo "Skipping tag creation."
              exit 0
          fi

          echo "==> Fetching all tags..."
          git fetch --tags

          echo "==> Finding the latest tag..."
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)

          if [ -z "$latest_tag" ]; then
              new_tag="v2.0"
              echo "No existing tags found. Starting with $new_tag"
          else
              echo "Latest tag found: $latest_tag"
              major=$(echo $latest_tag | cut -d. -f1 | sed 's/v//')
              minor=$(echo $latest_tag | cut -d. -f2)
              new_tag="v$major.$((minor+1))"

              # Ensure new tag doesn't already exist
              while git rev-parse "$new_tag" >/dev/null 2>&1; do
                  minor=$((minor+1))
                  new_tag="v$major.$minor"
              done
              echo "Calculated new tag: $new_tag"
          fi

          echo "==> Creating local tag $new_tag..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$new_tag"

          echo "==> Pushing tag to remote..."
          git push origin "$new_tag"

          echo "NEW_TAG=$new_tag" >> $GITHUB_ENV
          echo "Step complete: NEW_TAG set to $new_tag"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MobyParkAPI-${{ env.NEW_TAG }}
          path: ./bin/Release/**/*
          if-no-files-found: error
