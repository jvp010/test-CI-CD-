name: .NET CI

on:
  push:
  pull_request:
    branches: [ main ]

permissions:
  contents: write   # Required so the workflow can push tags

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      # Optional tests
      # - name: Run tests
      #   run: dotnet test MobyParkAPI.Tests/MobyParkAPI.Tests.csproj --no-build --configuration Release --logger trx

      - name: Generate new Git tag
        id: tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch --tags
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null)

          if [ -z "$latest_tag" ]; then
              new_tag="v2.0"
          else
              major=$(echo $latest_tag | cut -d. -f1 | sed 's/v//')
              minor=$(echo $latest_tag | cut -d. -f2)
              new_tag="v$major.$((minor+1))"

              while git rev-parse "$new_tag" >/dev/null 2>&1; do
                  minor=$((minor+1))
                  new_tag="v$major.$minor"
              done
          fi

          git tag "$new_tag"

          # Use the authenticated remote created by checkout
          git push origin "$new_tag"

          echo "NEW_TAG=$new_tag" >> $GITHUB_ENV
          echo "Created and pushed tag $new_tag"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MobyParkAPI-${{ env.NEW_TAG }}
          path: ./bin/Release/**/*
          if-no-files-found: error
