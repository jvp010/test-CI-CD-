name: .NET CI

on:
  push:
  pull_request:

permissions:
  contents: write   # Required so the workflow can push tags

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      # Optional tests
      # - name: Run tests
      #   run: dotnet test MobyParkAPI.Tests/MobyParkAPI.Tests.csproj --no-build --configuration Release --logger trx

      - name: Generate new Git tag
        id: tag
        run: |
          echo "==> Fetching all tags..."
          git fetch --tags

          # Get current commit
          current_commit=$(git rev-parse HEAD)
          echo "Current commit: $current_commit"

          # Check if commit already has a tag
          existing_tag=$(git tag --points-at $current_commit)

          if [ -n "$existing_tag" ]; then
              echo "Commit $current_commit already has tag(s): $existing_tag"
              NEW_TAG=$existing_tag
          else
              echo "==> Finding the latest tag..."
              latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)

              if [ -z "$latest_tag" ]; then
                  NEW_TAG="v2.0"
                  echo "No existing tags found. Starting with $NEW_TAG"
              else
                  echo "Latest tag found: $latest_tag"
                  major=$(echo $latest_tag | cut -d. -f1 | sed 's/v//')
                  minor=$(echo $latest_tag | cut -d. -f2)
                  NEW_TAG="v$major.$((minor+1))"

                  # Avoid overwriting existing tag
                  while git rev-parse "$NEW_TAG" >/dev/null 2>&1; do
                      minor=$((minor+1))
                      NEW_TAG="v$major.$minor"
                  done
                  echo "Calculated new tag: $NEW_TAG"
              fi

              echo "==> Creating local tag $NEW_TAG..."
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag "$NEW_TAG"
              git push origin "$NEW_TAG"
          fi

          # Always set NEW_TAG in environment
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "Step complete: NEW_TAG set to $NEW_TAG"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.NEW_TAG }}
          name: Release ${{ env.NEW_TAG }}
          body: "Automated release for ${{ env.NEW_TAG }}"
          files: ./bin/Release/**/*  
