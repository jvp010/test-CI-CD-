name: .NET CI/CD Release

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # 2. Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # 3. Restore dependencies
      - name: Restore dependencies
        run: dotnet restore

      # 4. Build solution
      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      # 5. Generate new Git tag
      - name: Generate new Git tag
        id: tag
        run: |
          git fetch --tags
          current_commit=$(git rev-parse HEAD)
          existing_tag=$(git tag --points-at $current_commit)

          if [ -n "$existing_tag" ]; then
              NEW_TAG=$existing_tag
          else
              latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
              if [ -z "$latest_tag" ]; then
                  NEW_TAG="v1.0"
              else
                  major=$(echo $latest_tag | cut -d. -f1 | sed 's/v//')
                  minor=$(echo $latest_tag | cut -d. -f2)
                  NEW_TAG="v$major.$((minor+1))"
                  while git rev-parse "$NEW_TAG" >/dev/null 2>&1; do
                      minor=$((minor+1))
                      NEW_TAG="v$major.$minor"
                  done
              fi
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag "$NEW_TAG"
              git push origin "$NEW_TAG"
          fi

          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV

      # 6. Publish project
      - name: Publish project
        run: dotnet publish -c Release -o publish

      # 7. Zip publish folder
      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Zip publish folder
        run: zip -r publish.zip publish

      # 8. Verify zip exists
      - name: Verify zip exists
        run: ls -l

      # 9. Create GitHub Release with zipped publish folder
      - name: Create GitHub Release
        if: ${{ success() }}   # <--- Only run if all previous steps succeeded
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.NEW_TAG }}
          name: Release ${{ env.NEW_TAG }}
          body: "Automated release for ${{ env.NEW_TAG }}"
          artifacts: publish.zip   # Correct input to attach files
